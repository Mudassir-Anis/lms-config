server:
  port: 8084
  forward-headers-strategy: framework
springdoc:
  api-docs:
    path: /v3/api-docs
spring:
  datasource:
    # url: jdbc:postgresql://course_service_db:5432/course_db
    url: jdbc:postgresql://localhost:5434/course_db
    username: username
    password: password
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  # data:
  #   redis:
  #     host: redis
  #     port: 6379
   data:
    redis:
      host: localhost
      port: 6379

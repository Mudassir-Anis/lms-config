server:
  port: 8082
  forward-headers-strategy: framework
  
rabbitmq:
  queue:
    name: notification.queue
  exchange:
    name: notification.exchange

  notification:
    routing:
      key: notification.#

springdoc:
  api-docs:
    path: /v3/api-docs
    
spring:
  datasource:
    # url: jdbc:postgresql://notification_service_db:5432/notification_db
    url: jdbc:postgresql://localhost:5436/notification_db
    username: username
    password: password
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  # data:
  #   redis:
  #     host: redis
  #     port: 6379
      
  # rabbitmq:
  #   host: rabbitmq
  #   port: 5672
  #   username: guest
  #   password: guest
    data:
      redis:
        host: localhost
        port: 6379
      
    rabbitmq:
      host: localhost
      port: 5672
      username: guest
      password: guest

server:
  port: 8081
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs

jwt:
  accessTokenExpiry: ${ACCESS_TOKEN_EXPIRY}
  refreshTokenExpiry: ${REFRESH_TOKEN_EXPIRY}
  secretKey: ${JWT_SECRET_KEY}

spring:
  datasource:
    url: jdbc:postgresql://user_service_db/user_db
    username: username
    password: password
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
